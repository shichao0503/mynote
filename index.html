<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./personal_homepage/" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#101716" />
    <title>前往施超的个人主页</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        background: #101716;
        color: #e9ede5;
        font:
          16px/1.8 system-ui,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      a {
        color: #bcf28b;
      }
    </style>
    <script>
      // 保留旧地址上的查询参数和区块锚点，使用 replace 避免返回时循环跳转。
      window.location.replace(
        "./personal_homepage/" + window.location.search + window.location.hash,
      );
    </script>
  </head>
  <body>
    <main>
      <h1>施超的个人主页</h1>
      <p>
        正在前往新地址。如未自动跳转，<a href="./personal_homepage/"
          >点击进入个人主页 ↗</a
        >。
      </p>
    </main>
  </body>
</html>
